name: Release

# A version tag (v0.1.0, matching package.json) builds the PC program and publishes it as a GitHub
# release; installed copies update themselves from the latest release (Velopack).
# Running it by hand builds the same files as a workflow artifact without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: dotnet tool restore

      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }

      # The latest release lets vpk make a small delta update from it (none before the first).
      - name: Previous release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: dotnet vpk download github --repoUrl ${{ env.REPO_URL }} --token ${{ github.token }} --outputDir release/installer

      # Engine (removes Node's signature with the Windows SDK's signtool first), window/tray
      # shell and Velopack packages in release/installer.
      - run: npm run build:installer

      - uses: actions/upload-artifact@v4
        with:
          name: AccountSwitch
          path: |
            release/installer/*Setup.exe
            release/installer/*Portable.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          dotnet vpk upload github --repoUrl $env:REPO_URL --token ${{ github.token }} `
            --outputDir release/installer --publish --tag "${{ github.ref_name }}" `
            --releaseName "AccountSwitch $version"

  # macOS (Apple silicon): tests, including the real login keychain, the app server built, ad hoc
  # signed and started once, and the menu bar app around it. Not published yet.
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:exe

      - name: Start the app server once
        run: |
          export ACCOUNTSWITCH_DATA="$RUNNER_TEMP/data" ACCOUNTSWITCH_PORT=47931
          release/engine/AccountSwitch-engine --no-open &
          pid=$!
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:47931/ && break; sleep 1; done
          page=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47931/)
          api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47931/api/v1/accounts)
          kill $pid
          echo "page $page, api $api"
          test "$page" = 200 && test "$api" = 401

      # The menu bar app with the server inside, signed ad hoc; zipped with ditto so the bundle
      # keeps its links and permissions.
      - run: node scripts/build-mac.mjs

      # Open the app as Finder would: the server starts and answers, the window shows the page,
      # and quitting stops the server.
      - name: Open the app once
        run: |
          open release/mac/AccountSwitch.app
          for i in $(seq 30); do
            test -f "$HOME/Library/Application Support/AccountSwitch/launch.json" && break; sleep 1
          done
          sleep 5
          pgrep -fl AccountSwitch-engine
          screencapture -x "$RUNNER_TEMP/window.png"
          osascript -e 'tell application "AccountSwitch" to quit'
          sleep 5
          if pgrep -fl AccountSwitch-engine; then echo "server still running"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-window
          path: ${{ runner.temp }}/window.png

      - uses: actions/upload-artifact@v4
        with:
          name: AccountSwitch-macos-arm64
          path: |
            release/mac/AccountSwitch.dmg
            release/mac/AccountSwitch-mac.zip
